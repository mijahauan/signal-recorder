# HF Time Standard Chrony Refclock Configuration
# Add this to /etc/chrony/chrony.conf or include it via:
#   include /etc/hf-timestd/chrony-timestd-refclocks.conf

# FUSE Feed: HF fusion (multi-broadcast Kalman, L2 calibrated)
# - Multi-station fusion across WWV/WWVH with L2 calibration applied
# - Uncertainty: ±0.3-1.0ms (ISO GUM uncertainty budget)
# - Latency: ~105-195 seconds
# - Primary HF source when on-host GPS+PPS is absent
#
# `precision 1e-3` matches the ±0.3-1.0 ms above AND what the writer itself
# stamps into the segment: multi_broadcast_fusion computes
# `precision = log2(uncertainty_sec)` per sample from its own measured
# uncertainty.  The line used to assert 1e-4 — ten times better than the
# uncertainty budget on the line above it, and ten times better than the
# writer's own claim.  Nothing consumed the discrepancy, but a config that
# contradicts its own comment is a trap for the next reader.
#
# ⛔ NO `trust` on FUSE — retired 2026-09-04 after it walked two stations.
#
# The earlier text here (2026-09-03) argued that `trust` exempts FUSE from
# chrony's majority vote and that a GPS-GOVERNED ADC earns the exemption,
# because fusion's self-gating "cannot see the one error class that matters".
# The precondition failed the next day on a governed ADC.  AC0G-B4 (RX888
# governed at 27 MHz, T6 present and correct) walked 11.6 s slow between
# 02:00Z and 16:03Z with FUSE selected under `trust` and `chronyc tracking`
# reporting the clock within 0.1 ms.  After a reboot corrected it, chrony
# marked the LAN stratum-1 a falseticker at 17:46:47Z, selected FUSE again,
# and the clock walked 1.0 s in 90 minutes.  AC0G-ND walked 12 s on 09-03 and
# 1.0 s on 09-04 the same way.  The ADC was not the error class.
#
# The mechanism, measured on ND 2026-09-04 (docs/design/HOST_CLOCK_INTEGRITY.md
# and the bus): the tick detector searches +-20 ms around the second the HOST
# clock names (tick_edge_detector.SEARCH_WINDOW_MS).  Once the host clock is
# more than 20 ms off, the real tick lies outside the window; the correlator
# returns a noise peak centred on the expected sample, its timing error is
# small by construction, fusion admits what clears 10 dB, and chrony is told
# "on time" while the clock walks.  Tick SNR fell 13 -> 9 dB as the clock
# error grew; the admitted d_clock read +2 ms against -500 ms at four NTP
# servers.  Fusion never entered holdover and never gated its feed.  A
# detector that cannot see beyond 20 ms cannot police a clock that has left
# the window, whatever governs the ADC.
#
# Without `trust`, chrony's majority rule does its job: four pool servers
# that agree with each other outvote a FUSE that has walked, and FUSE is
# selectable again the moment its ticks are back in the window and it agrees
# with them.  On 2026-09-04 19:17Z that is exactly what restored ND: chronyd
# restarted without `trust`, stepped 1.04 s to the pool, and FUSE went `#?`
# at +5 ms.  On a station with a LAN stratum-1 (B4) the peer outranks FUSE
# on root distance anyway; `trust` only ever mattered when FUSE was wrong.
#
# What FUSE still needs, and does not yet have (hf-timestd, 2026-09-05):
# withdraw from chrony when the authority manager's host_clock verdict reads
# suspect or fault; widen the tick search to cover the witnessed disagreement,
# or place it from the BCD / minute-marker decode.  Until then the pool is
# the backstop, and this line leaves it able to act.
#
# KEEP the WAN pool configured.  It costs nothing and it is the only
# independent witness a T3-only station has.  The T2 probe witnesses a pool
# server chrony will not select (`ProbeResult.witness_only`), and the
# host_clock verdict reads it.
#
# `smd doctor` reports a captured refclock as `chrony-refclock-captured`.
# History: METROLOGY.md §4.6 records the 2026-09-03 argument for `trust` and
# its 2026-09-04 refutation.
#
# ⛔ `noselect` on BOTH refclocks — the electorate rule, MEASUREMENT_MODEL.md
# §7.1.1 (decided 2026-09-10).  A source recovered from the sample stream may
# not vote on the host clock.  FUSE (T3) and HPPS (T6) are both recovered in
# sample time, so both inherit the converter's rate — and a source that
# inherits the quantity it would check cannot check it.  Fusion measures
# modulo one second, so an integer-second error and any accumulated rate error
# stay invisible to it; ND walked twelve seconds that way with chronyc
# reporting stratum 1 at 380 µs.  The host clock's electorate is the pool and
# any LAN stratum-1 (T5/T4/T2); once the registration places the second, no
# data product consults the host clock, and the pool's tens of milliseconds
# name the minute with four orders of magnitude to spare.
#
# `noselect` keeps both measured, logged and visible in `sourcestats`, and
# never selected.  The pool stops being outvoted, so the T2 witness can
# witness again.  Removing the lines would lose the comparison; `trust` or
# `prefer` would restore the vote.  Neither belongs here.
#
# core/chrony_refclock_gate.py (METROLOGY §4.6, superseded by §7.1.1) would
# re-offer FUSE with `selectopts -noselect` while T3/T6 is active, and it
# re-applies on every restart of its host process.  Set
# `[timing.authority_manager.chrony_gate] enabled = false` on every station
# (AC0G-ND shipped with it true) until the gate is retired; an enabled gate
# undoes this line within one authority tick.
refclock SHM 1 refid FUSE poll 4 precision 1e-3 offset 0.0 delay 0.001 noselect

# HPPS Feed: HF-PPS via BPSK matched-filter on TS-1 (LB-1421 GPSDO disciplined)
# NOTE: HPPS is NOT a hardware PPS.  It is the HF pulse-per-second recovered
# from the TimeSync-1 BPSK carrier -- the T6 tier.  Hosts running this may have
# no /dev/pps at all.
# - poll 0 = 1s = matches PPS cadence
#
# precision/delay describe the PAIR handed to chrony, NOT the edge estimator.
# Those are different quantities by three orders of magnitude, and conflating
# them is how this line came to assert 5e-6:
#   * the fine stage's own repeatability really is ~5-14 ns, but
#   * what chrony receives is (reference_time, system_time), and system_time
#     comes from the stream hand-off -- transport plus delivery batching --
#     which is millisecond-scale and is what the arrival floor measures.
# Asserting the estimator's precision for the pair produced a 26x overclaim
# (measured Std Dev 1445 us against a claimed +/- 55 us) and, worse, made that
# fiction look like a measurement: the "+/- 55us" column is just
# delay/2 + precision from this line, and it drove three separate
# misdiagnoses that each argued "constant and us-stable, therefore
# instrumental".  See hf-timestd#18 and #7.
#
# Values below are bounded by the arrival floor's measured sigma (~0.8-1.4 ms
# on AC0G-B4).  Never claim better than that here; the recorder derives the
# per-sample precision it pushes from the same floor.
refclock SHM 2 refid HPPS poll 0 precision 1e-3 offset 0.0 delay 0.002 noselect

# HPPS carries `noselect` for the same reason as FUSE (§7.1.1 above): T6 is
# recovered in sample time too.  It stays configured so sourcestats keeps
# measuring it against the pool — on B4 that comparison is how the wrong-peak
# lock of 2026-09-04 showed itself.  Neither `trust` nor `prefer` belongs on
# either line.

# Monitor with:
#   chronyc sources -v
#   chronyc sourcestats
